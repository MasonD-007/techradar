name: Deploy

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  update-manifests:
    name: Update Kubernetes Manifests
    runs-on: self-hosted
    # Skip our own deploy commits so a push can never retrigger a deploy.
    if: "${{ github.event.workflow_run.conclusion == 'success' && !startsWith(github.event.workflow_run.head_commit.message, 'chore: deploy') }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # main requires a PR; this token belongs to an admin and bypasses it
          # (GITHUB_TOKEN cannot). CI ignores k3s/** so the push won't loop.
          token: ${{ secrets.DEPLOY_PUSH_TOKEN }}

      # Images use :latest with imagePullPolicy: Always, so the manifests never
      # change on their own and ArgoCD sees no diff. Stamping the pod template
      # with the released commit forces a rollout that pulls the new :latest.
      - name: Stamp deploy revision
        run: |
          for app in backend frontend; do
            f=k3s/apps/$app/deployment.yaml
            sed -i -E "s|^( *deploy/revision:).*|\1 \"${{ github.event.workflow_run.head_sha }}\"|" "$f"
            grep "deploy/revision:" "$f"
          done

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add k3s/apps/backend/deployment.yaml k3s/apps/frontend/deployment.yaml

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: deploy ${{ github.event.workflow_run.head_sha }}"

          git push origin main
