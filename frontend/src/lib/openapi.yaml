components:
  schemas:
    dto.AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/dto.UserDTO"
    dto.GalleryEntry:
      type: object
      properties:
        blip_count:
          type: integer
        code:
          type: string
        top_technologies:
          type: array
          items:
            type: string
        updated_at:
          type: string
        username:
          type: string
    dto.ImportSource:
      type: object
      properties:
        shareCode:
          type: string
        templateSlug:
          type: string
    dto.LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    dto.RadarGraphItem:
      type: object
      properties:
        description:
          type: string
        icon_url:
          type: string
        name:
          type: string
        quadrant_id:
          type: integer
        quadrant_name:
          type: string
        ring_id:
          type: integer
        ring_name:
          type: string
        technology_id:
          type: string
    dto.RegisterRequest:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        password:
          type: string
        username:
          type: string
    dto.TemplateItemRequest:
      type: object
      properties:
        ring_id:
          type: integer
        technology_id:
          type: string
    dto.UserDTO:
      type: object
      properties:
        email:
          type: string
        id:
          type: string
        is_admin:
          type: boolean
        name:
          type: string
        username:
          type: string
    handlers.AddViewerRequest:
      type: object
      properties:
        username:
          type: string
    handlers.Blip:
      type: object
      properties:
        context: {}
        created_at:
          type: string
        id:
          type: integer
        updated_at:
          type: string
    handlers.CreateBlipRequest:
      type: object
      properties:
        context:
          type: object
          additionalProperties: true
    handlers.CreateTechnologyRequest:
      type: object
      properties:
        description:
          type: string
        icon_url:
          type: string
        id:
          type: string
        name:
          type: string
        quadrant_id:
          type: integer
    handlers.CreateUserRequest:
      type: object
      properties:
        email:
          type: string
        hashed_password:
          type: string
        id:
          type: string
        last_logged_in:
          type: string
        name:
          type: string
        username:
          type: string
    handlers.CreateUserTechnologyRequest:
      type: object
      properties:
        id:
          type: string
        ring_id:
          type: integer
        technology_id:
          type: string
        user_id:
          type: string
    handlers.Error:
      type: object
      properties:
        message:
          type: string
    handlers.GalleryResponse:
      type: object
      properties:
        has_more:
          type: boolean
        page:
          type: integer
        radars:
          type: array
          items:
            $ref: "#/components/schemas/dto.GalleryEntry"
    handlers.ImportRequest:
      type: object
      properties:
        source:
          $ref: "#/components/schemas/dto.ImportSource"
        technologyIds:
          type: array
          items:
            type: string
    handlers.ImportResponse:
      type: object
      properties:
        added:
          type: integer
        skipped:
          type: integer
    handlers.RadarGraphResponse:
      type: object
      properties:
        radar:
          type: array
          items:
            $ref: "#/components/schemas/dto.RadarGraphItem"
        username:
          type: string
    handlers.SetVisibilityRequest:
      type: object
      properties:
        listed:
          type: boolean
        visibility:
          type: string
    handlers.ShareCodeResponse:
      type: object
      properties:
        code:
          type: string
        created_at:
          type: string
        listed:
          type: boolean
        visibility:
          type: string
    handlers.ShareViewersResponse:
      type: object
      properties:
        viewers:
          type: array
          items:
            type: string
    handlers.Technology:
      type: object
      properties:
        blip_id:
          type: integer
          example: 1
        created_at:
          type: string
          example: 2026-04-05T12:00:00Z
        icon_url:
          type: string
          example: https://example.com/icon.svg
        id:
