openapi: 3.0.0
info:
  description: API for managing blips, technologies, users, and user technologies
  title: Tech Radar API
  contact: {}
  version: "1.0"
paths:
  /auth/login:
    post:
      description: Authenticate user and return JWT token
      tags:
        - auth
      summary: Login user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/dto.LoginRequest"
        description: Login credentials
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dto.AuthResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
  /auth/logout:
    post:
      description: Logout current user (client should discard token)
      tags:
        - auth
      summary: Logout user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /auth/register:
    post:
      description: Create a new user account and return authentication token
      tags:
        - auth
      summary: Register a new user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/dto.RegisterRequest"
        description: Registration data
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dto.AuthResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
  /auth/verify:
    get:
      description: Verify that the JWT token is valid and has not been tampered with
      tags:
        - auth
      summary: Verify JWT token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
  /blips:
    get:
      description: Get all blips
      tags:
        - blips
      summary: Get all blips
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/handlers.Blip"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
    post:
      description: Create a new blip
      tags:
        - blips
      summary: Create a blip
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handlers.CreateBlipRequest"
        description: Blip data
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Blip"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
  "/blips/{id}":
    get:
      description: Get blip by ID
      tags:
        - blips
      summary: Get a blip
      parameters:
        - description: Blip ID
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Blip"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
    put:
      description: Update blip by ID
      tags:
        - blips
      summary: Update a blip
      parameters:
        - description: Blip ID
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handlers.UpdateBlipRequest"
        description: Blip data
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Blip"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
    delete:
      description: Delete blip by ID
      tags:
        - blips
      summary: Delete a blip
      parameters:
        - description: Blip ID
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
  /gallery:
    get:
      description: List public radars whose owners opted into the gallery. No
        authentication required.
      tags:
        - gallery
      summary: List gallery radars
      parameters:
        - description: Search username or technology name
          name: q
          in: query
          schema:
            type: string
        - description: Quadrant id (1-4)
          name: quadrant
          in: query
          schema:
            type: integer
        - description: Page number, starting at 1
          name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.GalleryResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
  /radar/import:
    post:
      description: Merge technologies from a viewable radar or a template into the
        caller's radar. Technologies already on the radar are skipped and keep
        their ring.
      tags:
        - radar
      summary: Copy technologies into my radar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handlers.ImportRequest"
        description: Source and optional technology ids
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.ImportResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
  /share-codes:
    post:
      description: Create a new 6-character share code for the authenticated user, or
        return existing one
      tags:
        - share-codes
      summary: Create or get existing share code
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.ShareCodeResponse"
        "500":
          description: Internal Server Error
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
  /share-codes/my:
    get:
      description: Get the authenticated user's share code
      tags:
        - share-codes
      summary: Get my share code
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.ShareCodeResponse"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
    patch:
      description: Set the authenticated user's radar to public (anyone with the link)
        or private (only listed viewers), and optionally list a public radar in
        the gallery via listed
      tags:
        - share-codes
      summary: Set share code visibility
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handlers.SetVisibilityRequest"
        description: Visibility
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.ShareCodeResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
  /share-codes/my/viewers:
    get:
      description: List the usernames allowed to view the authenticated user's private radar
      tags:
        - share-codes
      summary: List private-radar viewers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.ShareViewersResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
    post:
      description: Add a viewer by username. Adding an existing viewer succeeds.
      tags:
        - share-codes
      summary: Allow a user to view my private radar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handlers.AddViewerRequest"
        description: Viewer
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
  "/share-codes/my/viewers/{username}":
    delete:
      tags:
        - share-codes
      summary: Remove a viewer from my private radar
      parameters:
        - description: Username
          name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
  "/share-codes/{code}":
    get:
      description: Get the full radar graph for a share code. Public radars need no
        auth; private radars require a bearer token for an allowed user.
      tags:
        - share-codes
      summary: Get radar graph by share code
      parameters:
        - description: Share code
          name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.RadarGraphResponse"
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
    delete:
      description: Delete a share code by code value
      tags:
        - share-codes
      summary: Delete a share code
      parameters:
        - description: Share code
          name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
  /technologies:
    get:
      description: Get all technologies
      tags:
        - technologies
      summary: Get all technologies
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/handlers.Technology"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
    post:
      description: Create a new technology (automatically creates a blip)
      tags:
        - technologies
      summary: Create a technology
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handlers.CreateTechnologyRequest"
        description: Technology data
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Technology"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
  "/technologies/by-name/{name}":
    get:
      description: Get technology by name
      tags:
        - technologies
      summary: Get a technology by name
      parameters:
        - description: Technology name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Technology"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
  "/technologies/by-quadrant/{quadrant_id}":
    get:
      description: Get all technologies in a quadrant
      tags:
        - technologies
      summary: Get technologies by quadrant
      parameters:
        - description: Quadrant ID
          name: quadrant_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/handlers.Technology"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
  "/technologies/{id}":
    get:
      description: Get technology by ID
      tags:
        - technologies
      summary: Get a technology
      parameters:
        - description: Technology ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Technology"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
    put:
      description: Update technology by ID
      tags:
        - technologies
      summary: Update a technology
      parameters:
        - description: Technology ID
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handlers.UpdateTechnologyRequest"
        description: Technology data
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Technology"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
    delete:
      description: Delete technology by ID
      tags:
        - technologies
      summary: Delete a technology
      parameters:
        - description: Technology ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
  /templates:
    get:
      tags:
        - templates
      summary: List starter templates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/handlers.TemplateSummary"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
    post:
      security:
        - BearerAuth: []
      tags:
        - templates
      summary: Create a starter template (admin)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handlers.TemplateRequest"
        description: Template
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.TemplateSummary"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
  "/templates/{slug}":
    get:
      tags:
        - templates
      summary: Get a starter template
      parameters:
        - description: Template slug
          name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.TemplateDetail"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
    put:
      security:
        - BearerAuth: []
      tags:
        - templates
      summary: Replace a starter template (admin)
      parameters:
        - description: Template slug
          name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handlers.TemplateRequest"
        description: Template
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.TemplateSummary"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
    delete:
      security:
        - BearerAuth: []
      tags:
        - templates
      summary: Delete a starter template (admin)
      parameters:
        - description: Template slug
          name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/handlers.Error"
  /user-technologies:
    post:
      description: Create a new user technology assignment
      tags:
        - user-technologies
      summary: Create a user technology assignment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handlers.CreateUserTechnologyRequest"
        description: User technology data
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UserTechnology"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.Error"
  "/user-technologies/user/{user_id}":
    get:
      description: Get all user technology assignments for a user
      tags:
        - user-technologies
      summary: Get user technologies by user
      parameters:
        - description: User ID
          name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
